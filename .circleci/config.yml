version: 2.1

jobs:
  test-java:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Set up Android SDK
          command: |
            # Install Android SDK Command-line tools
            mkdir -p $HOME/android-sdk/cmdline-tools
            curl -o android-sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-8092744_latest.zip
            unzip android-sdk.zip -d $HOME/android-sdk/cmdline-tools
            yes | $HOME/android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "build-tools;30.0.3" "platforms;android-30"
            echo "export ANDROID_HOME=$HOME/android-sdk" >> $BASH_ENV
            echo "export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/bin:$PATH" >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Calculate cache key
          command: |
            find . -name 'pom.xml' -o -name 'gradlew*' -o -name '*.gradle*' | \
                    sort | xargs cat > /tmp/CIRCLECI_CACHE_KEY
      - restore_cache:
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
      - run:
          command: chmod +x ./gradlew
      - run:
          name: Run Gradle tasks
          command: ./gradlew check
      - store_test_results:
          path: build/test-results
      - save_cache:
          key: cache-{{ checksum "/tmp/CIRCLECI_CACHE_KEY" }}
          paths:
            - ~/.gradle/caches
      - store_artifacts:
          path: build/reports

workflows:
  build-and-test:
    jobs:
      - test-java
