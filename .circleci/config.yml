version: 2.1

jobs:
  build:
    machine:
      image: android:default
    resource_class: large
    steps:
      - checkout
      - run:
          name: Create AVD
          command: |
            SYSTEM_IMAGES="system-images;android-29;default;x86"
            sdkmanager "$SYSTEM_IMAGES"
            echo "no" | avdmanager --verbose create avd -n test -k "$SYSTEM_IMAGES"
      - run:
          name: Launch Emulator
          command: |
            emulator -avd test -delay-adb -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          background: true
      - restore_cache:
          key: gradle-v1-{{ checksum "build.gradle" }} # Adjust path if necessary
      - run:
          name: Grant Execute Permissions to Gradle Wrapper
          command: chmod +x ./gradlew
      - run:
          name: Assemble Debug Android Test
          command: ./gradlew assembleDebugAndroidTest
      - run:
          name: Build Android App Bundle
          command: ./gradlew bundleRelease  # This builds the .AAB
      - run:
          name: Wait for Emulator Boot
          command: circle-android wait-for-boot
      - run:
          name: Run UI Tests
          command: ./gradlew connectedDebugAndroidTest

workflows:
  test:
    jobs:
      - build
